services:
  mongo:
    image: mongo:7
    container_name: shopsphere-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  backend:
    build: ./backend
    container_name: shopsphere-api
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/ecommerce_catalog
      JWT_SECRET: docker_dev_secret_change_me
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      NODE_ENV: production
    depends_on:
      - mongo
    ports:
      - "5000:5000"
  frontend:
    build: ./frontend
    container_name: shopsphere-web
    depends_on:
      - backend
    ports:
      - "5173:80"
volumes:
  mongo_data:
